# Khy OS — pip channel manifest (PyPI package: khy-os).
# [project] version is the STATIC single source of truth for the pip channel;
# scripts/release/publish-dual.sh bumps it at release time and
# scripts/ci/check-version-sync.js enforces that it matches
# packaging/npm/package.json, services/backend/package.json and
# packaging/modules/modules.json.
#
# platform/khy_platform/__init__.py must NOT hard-code __version__; it resolves
# the version dynamically from this file / installed metadata.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khy-os"
version = "1.1.14"
description = "Khy OS - AI platform operating system, distributed via PyPI (khy-os) and npm (@khy-os/khy-os). Python layer is a lightweight launcher that boots the Node.js backend."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
khy = "khy_platform.cli:main"

[tool.setuptools]
# Python packages live under platform/ (khy_platform launcher, khy_os bundle).
package-dir = { khy_platform = "platform/khy_platform" }
packages = ["khy_platform"]

[tool.setuptools.package-data]
# The Python launcher ships the standalone Node bundle as its only Node runtime
# payload. Source checkout mode still resolves the repository backend directly.
khy_platform = ["_resources/dev-constraints.txt", "_resources/tray-icon.png", "bundled/runtime/khy/bundle.mjs"]

[tool.khyos.android]
# Android 构建版本锁（单一真源，[DEPLOY-MAN-018] 第 2.1 节）。
# 消费方：platform/khy_platform/android_build.py。每个键都可用环境变量
# KHY_ANDROID_<KEY> 临时覆盖，例如 KHY_ANDROID_BUILD_TOOLS=34.0.0。
#
# 值必须与 android_build.py 的 _DEFAULT_LOCK 保持一致——pip 安装后本文件不随
# wheel 分发，那份字典是读不到本表时的兜底（platform/tests 里有守卫测试）。
compile_sdk = "36"        # 与 apps/khy-mobile/android/variables.gradle 的 compileSdkVersion 对齐
build_tools = "35.0.0"
cmdline_tools = "13114758"
ndk = ""                  # 随身 App 是 WebView + JS，不含原生代码，默认不装 NDK（省 1GB+）
