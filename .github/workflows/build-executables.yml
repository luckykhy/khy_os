name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to build (leave empty for all)'
        required: false
        default: ''
      platform:
        description: 'Platform (win-x64, linux-x64, macos-x64, macos-arm64, or empty for all)'
        required: false
        default: ''

# 默认只读。release job 单独提权为 contents: write（见文件末尾）。
permissions:
  contents: read

# 4 平台矩阵打包是最贵的流水线。同一 ref 只保留一次运行；
# tag 构建不取消 —— 发布产物不可重放。
concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-13
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm ci --prefix apps/ai-frontend
          npm ci --prefix software/khyquant/frontend

      # 发布链路上的 lint 暂为报告态。
      # 原因：npm run lint 是 `eslint src/ --max-warnings 0`，而 src/ 现存
      # 3417 个问题（428 errors + 2989 warnings / 2246 个文件中 1060 个命中）。
      # 保持阻断等于让任何 v* tag 都无法出包。
      # 质量把关改由 pr-gate.yml 的棘轮承担（新增文件零容忍），存量债务清零后
      # 删掉这里的 continue-on-error 即恢复阻断。
      - name: Lint (report only)
        continue-on-error: true
        working-directory: services/backend
        run: npm run lint

      - name: Test portable contracts
        shell: bash
        run: |
          npm test --workspace=khy-os-backend -- --runInBand \
            tests/bridge/bridgeAuth.paths.test.js \
            tests/tasks/diskOutput.paths.test.js \
            tests/utils/dataHome.appHome.test.js \
            tests/utils/sharedPortablePaths.test.js
          node --test \
            scripts/tests/artifactManifest.test.js \
            scripts/tests/portableArtifactBuilder.test.js \
            scripts/tests/portableHealthCheck.artifact.test.js \
            scripts/tests/packPortableArtifact.test.js \
            scripts/tests/portableHostIsolation.test.js \
            scripts/tests/packagePortable.test.js

      - name: Build and package portable runtime
        run: node scripts/portable/package-portable.js --kind runtime --keep-artifact

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khy-os-${{ matrix.platform }}
          path: |
            dist/portable/portable-runtime-*-${{ matrix.platform }}/
            dist/releases/portable-runtime-*-${{ matrix.platform }}.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # softprops/action-gh-release needs contents:write to create the release;
    # the default GITHUB_TOKEN is read-only and fails with 403 otherwise.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
