name: Dual-Channel Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_pip:
        description: 'Skip PyPI publish'
        required: false
        default: 'false'
      skip_npm:
        description: 'Skip npm publish'
        required: false
        default: 'false'
      test_pypi:
        description: 'Upload to TestPyPI instead of PyPI'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write    # OIDC token for sigstore/cosign keyless signing

# 发布绝不允许并发，也绝不允许被取消：
# publish-dual.sh 会推 tag、上传 PyPI 与 npm —— 中途被砍会留下
# 「npm 已发布、PyPI 未发布」这类无法回滚的半成品状态。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/backend
        run: npm run install:core

      - name: Run test suite (Jest)
        working-directory: services/backend
        run: npm test -- --passWithNoTests

      - name: Run Node built-in tests
        working-directory: services/backend
        run: npm run test:node

      - name: Install publish dependencies
        run: |
          npm install --no-save --ignore-scripts --workspaces=false esbuild@0.28.1 @yao-pkg/pkg@6.21.0
          pip install twine build sigstore cyclonedx-bom cyclonedx-py

      - name: Verify version sync
        run: node scripts/ci/check-version-sync.js

      - name: Verify CHANGELOG
        run: node scripts/release/changelog-new.js --check

      - name: Verify update index protocol
        run: node --test scripts/tests/updateIndex.test.js

      - name: Run release gate (deterministic checks)
        run: node scripts/release/release-gate.js
        env:
          NODE_ENV: release-gate

      - name: Build executables
        run: |
          node packaging/build/esbuild-modules.js --prod
          node packaging/build/pack-executable.js --all

      - name: Build on-demand payload assets
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./services/backend/package.json').version")"
          fi
          node scripts/release/build-payload-assets.js --version "$VERSION" --out publish/payloads
          node -e "const m=require('./publish/payloads/khy-payload-manifest.json'); if(m.version!==process.argv[1]) process.exit(1); if(Object.values(m.payloads).some(p=>p.files.some(f=>!/^[a-f0-9]{64}$/.test(f.sha256)||f.size<=0))) process.exit(1)" "$VERSION"

      # ── Sign artifacts before publishing ─────────────────────────────────────
      # Sigstore keyless signing (OIDC) provides cryptographic proof that the
      # artifacts were produced by this CI run. No long-lived secrets needed.
      - name: Sign PyPI artifacts (sigstore)
        if: ${{ inputs.test_pypi != 'true' }}
        run: |
          # Sign the wheel and sdist with sigstore (keyless, OIDC-backed).
          # The signature .sig files are attached to the PyPI upload as
          # provenance metadata and can be verified offline.
          for f in dist/*.whl dist/*.tar.gz; do
            [ -f "$f" ] || continue
            echo "Signing $f..."
            sigstore sign --yes "$f" || echo "sigstore sign failed for $f (non-fatal, continuing)"
          done

      - name: Sign npm package contents (sigstore)
        if: ${{ inputs.skip_npm != 'true' }}
        run: |
          # Create a tarball of what npm would publish and sign it.
          # This signs the exact artifact users download, not a transient build.
          ( cd packaging/npm && npm pack --dry-run > /dev/null 2>&1 )
          PACK_TARBALL=$(cd packaging/npm && npm pack --dry-run 2>/dev/null | tail -1)
          if [ -n "$PACK_TARBALL" ]; then
            echo "Signing npm package: $PACK_TARBALL"
            sigstore sign --yes "$PACK_TARBALL" || echo "sigstore sign failed for npm package (non-fatal, continuing)"
          fi

      # ── Generate SBOMs ────────────────────────────────────────────────────────
      # CycloneDX SBOMs enable downstream consumers to perform vulnerability
      # scanning against the exact dependency tree shipped in each release.
      - name: Generate SBOM (npm)
        if: ${{ inputs.skip_npm != 'true' }}
        run: |
          npm install --no-save @cyclonedx/cyclonedx-npm@1
          npx @cyclonedx/cyclonedx-npm --output-file sbom-npm.json .

      - name: Generate SBOM (pip)
        if: ${{ inputs.test_pypi != 'true' }}
        run: |
          pip install cyclonedx-py
          cyclonedx-py environment --output-file sbom-pip.json .

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            sbom-npm.json
            sbom-pip.json
          retention-days: 90
          compression-level: 1

      - name: Publish dual-channel
        run: |
          chmod +x scripts/release/publish-dual.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./services/backend/package.json').version")"
          fi
          ARGS=( "--version" "$VERSION" "--rehearse" )
          if [ "${{ inputs.skip_pip || 'false' }}" = 'true' ]; then ARGS+=( "--skip-pip" ); fi
          if [ "${{ inputs.skip_npm || 'false' }}" = 'true' ]; then ARGS+=( "--skip-npm" ); fi
          if [ "${{ inputs.test_pypi || 'false' }}" = 'true' ]; then ARGS+=( "--test-pypi" ); fi
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then ARGS+=( "--tag" "--push" "-y" ); fi
          bash scripts/release/publish-dual.sh "${ARGS[@]}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload on-demand payloads to GitHub Release
        if: ${{ inputs.test_pypi != 'true' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./services/backend/package.json').version")"
          fi
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "khy OS ${VERSION}" --notes "khy OS ${VERSION} release assets"
          gh release upload "$TAG" publish/payloads/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
