# ─────────────────────────────────────────────────────────────────────────────
# 临时诊断流水线 —— 用完即删，不要基于它写任何东西。
#
# 目的：拿到 Jest 在 ubuntu 上的确切失败清单。
# 为什么需要它：dual-channel-release.yml 的 Jest 门禁是「任何 v* tag 都无法发布」
# 的真正阻断点，但它的失败详情只在 Actions 日志里，而 /actions/jobs/<id>/logs
# 需要仓库 admin 权限（403）。pr-gate.yml 的 test-baseline 只在 pull_request 上跑，
# 本分支尚无 PR。
# 关键点：check-runs 的 annotations 是**公开可读**的，所以这里把失败清单用
# ::error:: 输出成注解，就能在没有 admin 权限的情况下取到。
#
# 本流水线只读、不发包、不推镜像、不写仓库。
# ─────────────────────────────────────────────────────────────────────────────
name: TEMP Jest on Linux (diagnostic)

on:
  push:
    branches: [chore/repo-layer-taxonomy]

permissions:
  contents: read

jobs:
  jest:
    name: Jest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      # 刻意不加 --ignore-scripts：better-sqlite3 是原生模块，跳过安装脚本会让
      # 所有触及数据库的测试在 require 阶段就失败，那样拿到的失败清单是假的。
      - name: Install backend dependencies
        working-directory: services/backend
        run: npm ci

      # 不让这一步决定成败 —— 我们要的是完整清单，而不是「第一个失败就停」。
      - name: Jest
        working-directory: services/backend
        run: npm test -- --passWithNoTests --ci > jest.log 2>&1 || true

      - name: Report failures as annotations
        if: always()
        working-directory: services/backend
        run: |
          set -uo pipefail
          counts=$(grep -aE '^(Test Suites|Tests):' jest.log | tr '\n' ' ')
          suites=$(grep -aE '^FAIL ' jest.log | sed 's/ ([0-9.]* s)$//' | sort -u)
          cases=$(grep -aE '^\s+● ' jest.log | grep -av 'Console' | sed 's/^ *//' | sort -u)

          {
            echo '## 汇总'
            echo "\`\`\`"; echo "$counts"; echo "\`\`\`"
            echo '## 失败 suite'
            echo "\`\`\`"; echo "${suites:-（无）}"; echo "\`\`\`"
            echo '## 失败用例'
            echo "\`\`\`"; echo "${cases:-（无）}"; echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # 注解里带上全部内容（换行编码成 %0A），这样无需 admin 权限即可读取。
          enc() { printf '%s' "$1" | sed ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::error title=Jest 汇总::$(enc "$counts")"
          echo "::error title=失败 suite::$(enc "${suites:-none}")"
          echo "::error title=失败用例::$(enc "${cases:-none}")"
