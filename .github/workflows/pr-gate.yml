name: PR Safety Gate

on:
  pull_request:
    branches: [main]

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check change safety
        run: node scripts/ci/check-change-safety.js --changed --strict-warnings
        env:
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Check version sync
        run: node scripts/ci/check-version-sync.js

      - name: Check agent rules
        run: node scripts/ci/check-agent-rules.js --changed
        env:
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Check leaf contracts
        run: node scripts/ci/check-leaf-contract.js --changed

      - name: Check Node syntax
        run: node scripts/ci/check-node-syntax.js
