name: ✨ 功能需求 / Feature Request
description: 提出新功能或改进。请说明「要解决什么问题」，而不是直接给实现方案。
title: "[FEAT] "
labels: ["type/feature", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Khy-OS 的质量目标是**功能、体积、流畅性三者兼顾**。
        任何新功能都要能回答：它值不值得付出对应的体积与启动耗时代价？请在下面的「代价评估」里正面回应这一点。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: |
        描述你遇到的真实场景与痛点，**先不要写方案**。
        反例：「希望增加 `--json` 参数」；正例：「我要在 CI 里解析 `khy status` 的输出，但当前输出是给人看的表格，正则很脆。」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案（可选）
      description: 如果你已有想法，请描述期望的行为与接口形态；不必给出代码。

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
      description: 包括「用现有能力绕过」的尝试及其不足。为什么现有能力不够？

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 不清楚 / 跨多个模块
        - CLI 与 TUI (services/backend/src/cli)
        - AI 网关与供应商适配 (services/backend/src/services/gateway)
        - 后端服务与 Web API (services/backend)
        - AI 管理前端 (apps/ai-frontend)
        - khyquant 量化应用 (software/khyquant)
        - Python 启动器 (platform/khy_platform)
        - OS 内核 (kernel, C)
        - MoonBit / WASM 模块
        - 打包与发布 (packaging, scripts/release)
        - 文档 (docs)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否为破坏性变更
      description: 会不会改变现有命令行为、配置格式、API 契约或产物结构？
      options:
        - 不是，纯新增
        - 不确定
        - 是，会破坏现有行为
      default: 0
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: 代价评估（体积 / 流畅性）
      description: |
        请尽力估算，不确定就写「不确定」并说明原因——重点是**不要跳过这个问题**。
      value: |
        - 是否需要引入新的第三方依赖？若需要，是哪个、大致多大：
        - 对分发产物体积的预估影响（pip wheel / npm 包 / standalone 可执行文件）：
        - 对启动耗时或交互流畅性的预估影响：
        - 能否做成惰性加载 / 可选模块，让不使用的用户零成本：
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已检索既有 Issue 与 Discussions，确认这不是重复提案
          required: true
        - label: 我描述的是问题本身，而非只有一个实现方案
          required: true
